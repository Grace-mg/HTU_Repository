<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email address</title>
</head>
<body style="margin: 0; padding: 0; background-color: #12141a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <!-- Main Outer Container -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #12141a; padding: 40px 16px;">
    <tr>
      <td align="center">
        <!-- Inner Card Container -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 480px; background-color: #1d222b; border-radius: 16px; padding: 40px 36px; color: #ffffff;">
          
          <!-- Top Right Logo Badge -->
          <tr>
            <td align="right" style="padding-bottom: 12px;">
              <div style="display: inline-block; width: 36px; height: 36px; background-color: #000000; border-radius: 6px; border: 1px solid #333945; text-align: center; line-height: 36px; color: #ffffff; font-weight: 800; font-size: 16px; font-family: sans-serif;">
                HTU
              </div>
            </td>
          </tr>

          <!-- Main Heading -->
          <tr>
            <td style="padding-top: 12px; padding-bottom: 28px;">
              <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: -0.4px;">
                Confirm your email address
              </h1>
            </td>
          </tr>

          <!-- Primary Pill Button -->
          <tr>
            <td style="padding-bottom: 32px;">
              <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; background-color: #ffffff; color: #12141a; font-size: 15px; font-weight: 700; text-decoration: none; padding: 12px 36px; border-radius: 9999px; text-align: center;">
                Confirm
              </a>
            </td>
          </tr>

          <!-- Backup Code Subheading -->
          <tr>
            <td style="padding-bottom: 12px;">
              <p style="margin: 0; font-size: 14px; color: #9ca3af; line-height: 1.5;">
                You can use this code as a backup, just in case:
              </p>
            </td>
          </tr>

          <!-- Large Bold 6-Digit Code -->
          <tr>
            <td style="padding-bottom: 16px;">
              <div style="font-size: 34px; font-weight: 800; color: #ffffff; letter-spacing: 6px; font-family: 'Courier New', Courier, monospace; line-height: 1.2;">
                {{ .Token }}
              </div>
            </td>
          </tr>

          <!-- Code Expiration Notice -->
          <tr>
            <td style="padding-bottom: 36px;">
              <p style="margin: 0; font-size: 13px; color: #9ca3af; line-height: 1.5;">
                Verification codes expire after two hours.
              </p>
            </td>
          </tr>

          <!-- Sign-off -->
          <tr>
            <td style="padding-bottom: 24px;">
              <p style="margin: 0; font-size: 14px; color: #e5e7eb; line-height: 1.6;">
                Thanks,<br>
                <strong style="color: #ffffff;">HTU Repository</strong>
              </p>
            </td>
          </tr>

          <!-- Footer Links & Address -->
          <tr>
            <td align="center" style="border-top: 1px solid #2b313d; padding-top: 24px;">
              <p style="margin: 0 0 12px 0; font-size: 12px; color: #6b7280;">
                <a href="mailto:support@htu.edu.gh" style="color: #9ca3af; text-decoration: none;">Help</a>
                &nbsp;&nbsp;|&nbsp;&nbsp;
                <a href="https://htu.edu.gh" style="color: #9ca3af; text-decoration: none;">Email security tips</a>
              </p>
              <p style="margin: 0; font-size: 11px; color: #6b7280; line-height: 1.5;">
                Ho Technical University Repository. Ho, Volta Region, Ghana.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
